url: "${MAESTRO_BASE_URL}/signin"
---
- launchApp:
    clearState: true
- waitForAnimationToEnd
- runFlow:
    when:
      visible: "Email"
    commands:
      - tapOn: "Email"
      - inputText: "${MAESTRO_TEST_EMAIL}"
      - tapOn: "Password"
      - inputText: "${MAESTRO_TEST_PASSWORD}"
      - tapOn:
          text: "Sign In"
          index: 1
- waitForAnimationToEnd
- openLink: "${MAESTRO_BASE_URL}/dashboard/requirements"
- waitForAnimationToEnd
- assertVisible: "Requirements"
- assertNotVisible: "Welcome back,"
